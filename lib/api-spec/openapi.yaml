components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        createdAt:
          type: string
      required:
        - id
        - username
        - email
        - createdAt

    ForgotPasswordInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    ForgotPasswordResult:
      type: object
      properties:
        message:
          type: string
        resetToken:
          type: string
        resetLink:
          type: string
      required:
        - message
        - resetToken
        - resetLink

    ResetPasswordInput:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - token
        - newPassword

    RegisterInput:
      type: object
      properties:
        username:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - username
        - email
        - password

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token

    Resume:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        resumeName:
          type: string
        templateId:
          type: integer
        fontFamily:
          type: string
        isPublic:
          type: boolean
        publicUrl:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - resumeName
        - templateId
        - fontFamily
        - isPublic
        - createdAt
        - updatedAt

    ResumeInput:
      type: object
      properties:
        resumeName:
          type: string
        templateId:
          type: integer
        fontFamily:
          type: string
      required:
        - resumeName
        - templateId

    ResumeUpdate:
      type: object
      properties:
        resumeName:
          type: string
        templateId:
          type: integer
        fontFamily:
          type: string
        isPublic:
          type: boolean

    ResumeDetail:
      type: object
      properties:
        resume:
          $ref: "#/components/schemas/Resume"
        personalInfo:
          $ref: "#/components/schemas/PersonalInfo"
        objective:
          $ref: "#/components/schemas/Objective"
