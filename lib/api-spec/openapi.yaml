  /resumes/{resumeId}/ats-score:
    get:
      operationId: getAtsScore
      tags: [resumes]
      summary: Get ATS compatibility score and tips
      parameters:
        - name: resumeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ATS score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtsScore"

  /resumes/{resumeId}/export/pdf:
    get:
      operationId: exportResumePdf
      tags: [export]
      summary: Export resume as PDF (returns base64 encoded PDF)
      parameters:
        - name: resumeId
